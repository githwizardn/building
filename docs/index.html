<title>კორპუსი - რეალური დროის სიმულატორი</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11151c; }
  body { font-family: system-ui, "Segoe UI", sans-serif; color: #e8edf4; }
  #app { position: fixed; inset: 0; display: flex; }
  #canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #11151c; }
  #canvas-wrap canvas { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important; }

  #loading-overlay {
    position: absolute; inset: 0; background: #11151c; z-index: 1000;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-size: 18px; font-weight: bold; color: #9fb3cc; transition: opacity 0.4s ease;
  }
  #loading-overlay.hidden { opacity: 0; pointer-events: none; }

  #floors {
    position: absolute; top: 12px; left: 12px; z-index: 6;
    display: flex; flex-direction: column-reverse; gap: 3px;
    padding: 8px; border-radius: 10px;
    background: rgba(17,21,28,.78); border: 1px solid #2b3442;
    backdrop-filter: blur(6px);
  }
  #floors button {
    width: 54px; padding: 5px 0; cursor: pointer;
    font: 600 12px/1 system-ui; color: #cfd8e3;
    background: #1b2330; border: 1px solid #2f3b4d; border-radius: 5px;
  }
  #floors button:hover { background: #26313f; color: #fff; }
  #floors button.on { background: #3d6ea8; border-color: #6ba3e0; color: #fff; }
  #floors button.aux-btn { width: 54px; font-size: 10px; line-height: 1.15; padding: 6px 2px; color: #a9dca9; border-color: #38513a; }
  #floors button.aux-btn.on { background: #2c3a2c; border-color: #6fbf6f; color: #d6f5d6; }

  #explode-btn {
    position: absolute; top: 12px; left: 75px; z-index: 6;
    padding: 10px 14px; cursor: pointer; border-radius: 10px;
    background: rgba(17,21,28,.78); border: 1px solid #2b3442;
    backdrop-filter: blur(6px);
    color: #cfd8e3; font: 600 13px/1 system-ui;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s ease;
  }
  #explode-btn:hover { background: #26313f; color: #fff; }
  #explode-btn.on { background: #3d6ea8; border-color: #6ba3e0; color: #fff; }

  #view-apt-btn {
    position: absolute; top: 12px; left: 200px; z-index: 6; 
    padding: 10px 14px; cursor: pointer; border-radius: 10px; 
    background: rgba(17,21,28,.78); border: 1px solid #2b3442; 
    backdrop-filter: blur(6px);
    color: #cfd8e3; font: 600 13px/1 system-ui;

  #view-apt-btn.on { background: #3d6ea8; border-color: #6ba3e0; color: #fff; }

  #time-controls {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; border-radius: 30px;
    background: rgba(17,21,28,.85); border: 1px solid rgba(255,255,255,0.15);

  #time-display { font-weight: bold; min-width: 45px; text-align: center; }
  #weather-status { font-size: 11px; color: #a9b5c5; margin-left: 8px; }

    width: 320px; flex: none; overflow-y: auto;
    padding: 18px; 
    background: rgba(23, 29, 38, 0.85); 
    backdrop-filter: blur(12px);

    background: #1b2330; border: 1px solid #2f3b4d; border-radius: 6px;

  #room-filters button:hover { background: #26313f; color: #fff; }
  #room-filters button.on { background: #3d6ea8; border-color: #6ba3e0; color: #fff; }

  .unit {
    margin-bottom: 8px; padding: 10px 12px; border-radius: 8px;
    background: #1e2632; border: 1px solid #2b3442;
  }
  .unit .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .unit .no { font-weight: 700; font-size: 14px; }
  .unit .meta { font-size: 11px; color: #8b98aa; }
  .unit .owner { margin-top: 6px; font-size: 13px; color: #cfe0f5; }
  .unit .owner.empty { color: #6d7a8c; font-style: italic; }
  .unit .pn { margin-top: 6px; font-size: 11px; color: #9fb3cc; font-family: ui-monospace, Consolas, monospace; letter-spacing: .3px; }

  .unit .mortgage { margin-top: 6px; font-size: 11px; color: #d8b48a; line-height: 1.45; }
  .unit .mortgage b { color: #f0c674; font-weight: 600; }
  .unit .flag { display: inline-block; margin-top: 6px; margin-right: 4px; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
  .unit .flag.warn { background: #4a2a2a; color: #f5a3a3; }
  .unit .flag.work { background: #2f3a4a; color: #a9c8ec; }
  .unit .flag.store { background: #2c3a2c; color: #a9dca9; }
  .unit.aux { background: #1b2129; border-style: dashed; }

  #hint { position: absolute; bottom: 12px; left: 12px; font-size: 12px; color: #7f8b9c; }
  #err { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
  #data-error { display: none; margin: 0 0 12px; padding: 10px 12px; border: 1px solid #704040; border-radius: 8px; background: #3a2428; color: #ffc1c1; font-size: 12px; line-height: 1.45; }

  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #canvas-wrap { flex: 0 0 52%; min-height: 220px; }
    #panel { width: 100%; min-height: 0; flex: 1; padding: 14px; border-left: 0; border-top: 1px solid #2b3442; }
    #floors { top: auto; right: 8px; bottom: 8px; left: 8px; flex-direction: row; gap: 4px; overflow-x: auto; }
    #floors button { width: 40px; min-width: 40px; min-height: 36px; }
    #floors button.aux-btn { width: 58px; min-width: 58px; }
    #explode-btn { top: 8px; left: 8px; padding: 6px 10px; font-size: 11px; }
    #view-apt-btn { top: 8px; left: 110px; padding: 6px 10px; font-size: 11px; }
    #hint { right: 8px; bottom: 58px; left: 8px; text-align: center; font-size: 11px; }
    #time-controls { bottom: 70px; padding: 8px 12px; }
    #time-slider { width: 120px; }
  }

const sunPosition = new THREE.Vector3();
const lat = 41.708531;
const lon = 44.880144;

function updateSunAndSky(date) {
  const sunPos = SunCalc.getPosition(date, lat, lon);
  const phi = Math.PI / 2 - sunPos.altitude;
  const theta = Math.PI - sunPos.azimuth; 

  sunPosition.setFromSphericalCoords(1, phi, theta);
  skyUniforms['sunPosition'].value.copy(sunPosition);
  sunLight.position.copy(sunPosition).multiplyScalar(100);

  const altitude = sunPos.altitude;
  
  if (altitude > 0) {
    sunLight.color.setHex(0xffffff);
    sunLight.intensity = 2.5;
    ambientLight.intensity = 1.2;
  } else {
    sunLight.color.setHex(0x4477aa); 
    sunLight.intensity = 0.2;
    ambientLight.intensity = 0.4;
  }

  const hours = date.getHours() + date.getMinutes() / 60;
  if (hours < 6 || hours > 20) {
    skyUniforms['turbidity'].value = 20; 
    skyUniforms['rayleigh'].value = 4;
    skyUniforms['mieCoefficient'].value = 0.01;
    scene.fog.color.setHex(0x050a14); // ოპტიმიზაცია
  } else if (hours < 8 || hours > 18) {
    skyUniforms['turbidity'].value = 15;
    skyUniforms['rayleigh'].value = 3;
    scene.fog.color.setHex(0x7b9bbd); // ოპტიმიზაცია
  } else {
    skyUniforms['turbidity'].value = 10; 
    skyUniforms['rayleigh'].value = 2;  
    scene.fog.color.setHex(0x9fc4e5); // ოპტიმიზაცია
  }
}

let rainParticles = null;
let snowParticles = null;

function createPrecipitation(type) {
  if (rainParticles) { scene.remove(rainParticles); rainParticles = null; }
  if (snowParticles) { scene.remove(snowParticles); snowParticles = null; }

  const particleCount = 3000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);

  for (let i = 0; i < particleCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 100;
    positions[i * 3 + 1] = Math.random() * 80;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
  }
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  let material;
  if (type === 'rain') {
    material = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.15, transparent: true, opacity: 0.6 });
  } else {
    material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0.8 });
  }

  const particles = new THREE.Points(geometry, material);
  scene.add(particles);

  if (type === 'rain') rainParticles = particles;
  else snowParticles = particles;
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`;
    const res = await fetch(url);
    const data = await res.json();
    const weather = data.current_weather;
    const code = weather.weathercode;
    
    let statusText = "მოწმენდილი";
    let effect = null;

    if (code >= 51 && code <= 67) { statusText = "წვიმა"; effect = 'rain'; }
    else if (code >= 71 && code <= 77) { statusText = "თოვლი"; effect = 'snow'; }
    else if (code >= 80 && code <= 82) { statusText = "ძლიერი წვიმა"; effect = 'rain'; }
    else if (code >= 85 && code <= 86) { statusText = "ძლიერი თოვლი"; effect = 'snow'; }
    else if (code >= 95) { statusText = "ჭექა-ქუხილი"; effect = 'rain'; }
    else if (code >= 1 && code <= 3) { statusText = "ღრუბლიანი"; }

    weatherStatus.textContent = `🌡️ ${weather.temperature}°C · ${statusText}`;
    if (effect) createPrecipitation(effect);
  } catch (e) {
    weatherStatus.textContent = "ამინდი მიუწვდომელია";
  }
}

let isTimeSync = true;
let currentDate = new Date();
let syncResumeTimer = null;

function updateTimeDisplay() {
  const hours = currentDate.getHours().toString().padStart(2, '0');
  const minutes = currentDate.getMinutes().toString().padStart(2, '0');
  timeDisplay.textContent = `${hours}:${minutes}`;
  timeSlider.value = currentDate.getHours() + currentDate.getMinutes() / 60;
}

setInterval(() => {
  if (isTimeSync) {
    currentDate = new Date();
    updateTimeDisplay();
    updateSunAndSky(currentDate);
  }
}, 1000);

timeSlider.addEventListener('input', (e) => {
  isTimeSync = false;
  clearTimeout(syncResumeTimer);
  
  const val = parseFloat(e.target.value);
  const h = Math.floor(val);
  const m = Math.floor((val - h) * 60);
  currentDate.setHours(h, m, 0);
  updateTimeDisplay();
  updateSunAndSky(currentDate);

  // 10 წამის შემდეგ ისევ რეალურ დროზე გადადის
  syncResumeTimer = setTimeout(() => {
    isTimeSync = true;
    currentDate = new Date();
  }, 10000);
});

const unitsByFloor = new Map();
let nonResidential = [];

async function loadResidents() {
  try {
    const isLocal = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
    let res = isLocal
      ? await fetch("../output/residents.json")
      : await fetch("../output/residents.public.json");
    if (!res.ok && isLocal) res = await fetch("../output/residents.public.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data.units) || !Array.isArray(data.non_residential)) throw new Error("სტრუქტურა");
    for (const u of data.units) {
      if (!unitsByFloor.has(u.floor)) unitsByFloor.set(u.floor, []);
      unitsByFloor.get(u.floor).push(u);
    }
    nonResidential = data.non_residential;
  } catch (e) {
    dataError.textContent = "ბინების მონაცემები ვერ ჩაიტვირთა.";
    dataError.style.display = "block";
  }
}

function unitCard(u) {
  const div = document.createElement("div");
  div.className = "unit";
  let html = `<div class="top"><span class="no">ბინა ${u.unit}</span><span class="meta">${u.area != null ? u.area + " მ²" : ""}</span></div>`;
  const owner = u.owner || "";
  if (owner) html += `<div class="owner" title="კონფიდენციალურობის დაცვის მიზნით, სახელები დაფარულია">${owner}</div>`;
  if (u.pn) html += `<div class="pn">პ/ნ: ${u.pn}</div>`;
  if (u.doc || u.docNo || u.date) {
    const parts = [];
    if (u.doc) parts.push(`<b>${u.doc}</b>`);
    if (u.docNo) parts.push(`№ ${u.docNo}`);
    if (u.date) parts.push(u.date);
    html += `<div class="doc">${parts.join(" · ")}</div>`;
  }
  if (u.mortgage) html += `<div class="mortgage">იპოთეკა: <b>${u.mortgage.bank}</b></div>`;
  if (u.cadastral) html += `<div class="doc">საკადასტრო: ${u.cadastral}</div>`;
  if (u.missing) html += `<span class="flag warn">რეესტრში არ ფიგურირებს</span>`;
  if (u.workshop) html += `<span class="flag work">სახელოსნო</span>`;
  if (u.storage) html += `<span class="flag store">სათავსო</span>`;
  div.innerHTML = html;
  return div;
}

  div.innerHTML = html;
  return div;
}

function classifyPoint(point) {
  for (const zone of ROOM_ZONES) {

  if (isExploded) {
    targetLookAt.set(0, 50, 0); 
    targetCamPos.set(110, 80, 130); 
    isAnimating = true;
    targetShaftScale = 3.37; 
  } else {
    targetLookAt.set(0, 15, 0);
    targetCamPos.set(43, 22, 76);
    isAnimating = true;
    targetShaftScale = 1.0;
  }

  for (const [n, meshes] of floorMeshes) {
    for (const mesh of meshes) {
      if (mesh.isMesh && mesh.material) {
        mesh.material.transparent = isExploded;
        mesh.material.opacity = isExploded ? 0.3 : 1.0;
        mesh.material.clippingPlanes = isExploded ? clipPlanes : [];
        mesh.material.clipIntersection = true;
        mesh.material.needsUpdate = true;
      }
    }
  }

  for (const mesh of roofMeshes) {
    const nameLower = mesh.name.toLowerCase();
    const isSolidBlock = nameLower.includes("machine") || nameLower.includes("service") || nameLower.includes("lift");
    
    if (isExploded) {
      if (isSolidBlock) {
        mesh.material.transparent = false;
        mesh.material.opacity = 1.0;
        mesh.material.clippingPlanes = []; 
      } else {
        mesh.material.transparent = true;
        mesh.material.opacity = 0.001; 
        mesh.material.clippingPlanes = []; 
      }
    } else {
      mesh.material.transparent = false;
      mesh.material.opacity = 1.0;
      mesh.material.clippingPlanes = [];
    }
    mesh.material.needsUpdate = true;
  }

  for (const mesh of entranceMeshes) {
    if (isExploded) {
      mesh.material.transparent = true;
      mesh.material.opacity = 0.001;
    } else {
      mesh.material.transparent = false;
      mesh.material.opacity = 1.0;
    }
    mesh.material.needsUpdate = true;
  }

  if (isExploded) {
    if (!isAptViewActive) {
      apartmentsSideA.forEach(apt => apt.visible = true);
      apartmentsSideB.forEach(apt => apt.visible = true);
    }
  } else {
    apartmentsSideA.forEach(apt => apt.visible = false);
    apartmentsSideB.forEach(apt => apt.visible = false);
  }
});

function paint(mesh, on) {
  if (!mesh.isMesh) return; 
  if (!mesh.userData.selectionMaterial) {
    mesh.userData.selectionMaterial = mesh.material.clone();
    mesh.material = mesh.userData.selectionMaterial;
  }
  mesh.material.color.copy(on ? HOT : BASE);
}

function clearSideHighlight() {
  if (!sideHighlight) return;
  scene.remove(sideHighlight);
  sideHighlight.geometry.dispose();
  sideHighlight = null;
}

function roomCountForUnit(unit) { return unit.rooms || null; }

function showFloorHighlight(floor, side, roomCount) {
  clearSideHighlight();
  const positions = [];
  const worldVertex = new THREE.Vector3();
  const clipHalfPlane = (polygon, coordinate, boundary, keepLess) => {
    const clipped = [];
    for (let i = 0; i < polygon.length; i++) {
      const start = polygon[i];
      const end = polygon[(i + 1) % polygon.length];
      const startValue = coordinate(start);
      const endValue = coordinate(end);
      const startInside = keepLess ? startValue <= boundary : startValue >= boundary;
      const endInside = keepLess ? endValue <= boundary : endValue >= boundary;
      if (startInside) clipped.push(start);
      if (startInside !== endInside) {
        const t = (boundary - startValue) / (endValue - startValue);
        clipped.push(start.clone().lerp(end, t));
      }
    }
    return clipped;
  };
  const clipToRect = (polygon, minX, maxX, minZ, maxZ) => {
    let result = clipHalfPlane(polygon, (p) => p.x, minX, false);
    result = clipHalfPlane(result, (p) => p.x, maxX, true);
    result = clipHalfPlane(result, (p) => p.z, minZ, false);
    result = clipHalfPlane(result, (p) => p.z, maxZ, true);
    return result.length >= 3 ? [result] : [];
  };
  const clipToSelection = (triangle) => {
    let regions = [];
    for (const zone of ROOM_ZONES) {
      if (roomCount && zone.roomCount !== roomCount) continue;
      if (side && zone.side !== side) continue;
      regions.push(...clipToRect(triangle, zone.minX, zone.maxX, zone.minZ, zone.maxZ));
    }
    return regions;
  };
  for (const mesh of floorMeshes.get(floor) || []) {
    if (!mesh.isMesh) continue; 
    mesh.updateWorldMatrix(true, false);
    const position = mesh.geometry.getAttribute("position");
    const index = mesh.geometry.index;
    const vertexCount = index ? index.count : position.count;
    for (let i = 0; i + 2 < vertexCount; i += 3) {
      const triangle = [];
      for (let j = 0; j < 3; j++) {
        const vertexIndex = index ? index.getX(i + j) : i + j;
        worldVertex.fromBufferAttribute(position, vertexIndex).applyMatrix4(mesh.matrixWorld);
        triangle.push(worldVertex.clone());
      }
      for (const region of clipToSelection(triangle)) {
        for (let j = 1; j + 1 < region.length; j++) {
          for (const vertex of [region[0], region[j], region[j + 1]]) {
            positions.push(vertex.x, vertex.y, vertex.z);
          }
        }
      }
    }
  }
  if (!positions.length) return;
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.computeVertexNormals();
  sideHighlight = new THREE.Mesh(geometry, sideHighlightMaterial);
  sideHighlight.renderOrder = 1;
  scene.add(sideHighlight);
}

function selectFloor(n) {
  auxMode = false;
  if (selected === n && !selectedSide) selected = null;
  else selected = n;
  selectedSide = null;
  selectedRoomCount = null;

  if (selected !== null) {
    controls.autoRotate = false; 
    const originalFloorY = 1.5 + (selected - 1) * 3 + 1.5;
    const explosionOffset = isExploded ? (selected - 1) * 8 : 0;
    const floorY = originalFloorY + explosionOffset;
    targetLookAt.set(0, floorY, 0); 
    targetCamPos.set(45, floorY + 10, 65); 
    isAnimating = true;
  } else {
    controls.autoRotate = false; 
    targetLookAt.set(0, isExploded ? 50 : 15, 0);
    targetCamPos.set(isExploded ? 110 : 43, isExploded ? 80 : 22, isExploded ? 130 : 76);
    isAnimating = true;
  }
  refreshSelection();
}

function selectRoomCount(roomCount) {
  auxMode = false;
  selectedRoomCount = selectedRoomCount === roomCount ? null : roomCount;
  selectedSide = null;
  refreshSelection();
}

function selectBuildingSide(n, side, roomCount) {
  auxMode = false;
  selected = n;
  selectedSide = side;
  selectedRoomCount = roomCount;
  refreshSelection();
}

function toggleAux() {
  auxMode = !auxMode;
  if (auxMode) {
    selected = null;
    selectedSide = null;
    selectedRoomCount = null;
  }
  refreshSelection();
}

function refreshSelection() {
  for (const [n, meshes] of floorMeshes) {
    for (const mesh of meshes) {
      paint(mesh, n === selected && !selectedSide && !selectedRoomCount);
    }
  }
  if (selected !== null && (selectedSide || selectedRoomCount)) {
    showFloorHighlight(selected, selectedSide, selectedRoomCount);
  }
  else clearSideHighlight();
  for (const button of roomFilters.children) {
    button.classList.toggle("on", Number(button.dataset.rooms) === selectedRoomCount);
  }
  for (const b of floorBar.children) {
    if (b.classList.contains("aux-btn")) b.classList.toggle("on", auxMode);
    else b.classList.toggle("on", Number(b.dataset.floor) === selected);
  }
  renderPanel();
}

function renderPanel() {
  unitsBox.innerHTML = "";
  if (auxMode) {
    panelTitle.textContent = "არასაცხოვრებელი ფართები";
    if (!nonResidential.length) {
      unitsBox.innerHTML = `<div class="unit"><div class="owner empty">მონაცემები არ არის</div></div>`;
      return;
    }
    for (const a of nonResidential) unitsBox.appendChild(auxCard(a));
    return;
  }
  if (selected === null) {
    panelTitle.textContent = selectedRoomCount
      ? `აირჩიე სართული · ${selectedRoomCount}-ოთახიანი`
      : "აირჩიე სართული ან ბინის ზონა";
    return;
  }
  const selectionLabels = [];
  if (selectedRoomCount) selectionLabels.push(`${selectedRoomCount}-ოთახიანი`);
  panelTitle.textContent = `${selected}-ე სართული${selectionLabels.length ? ` · ${selectionLabels.join(" · ")}` : ""}`;
  
  const units = [...(unitsByFloor.get(selected) || [])]
    .filter((u) => !selectedSide || u.side === selectedSide)
    .filter((u) => !selectedRoomCount || roomCountForUnit(u) === selectedRoomCount)
    .sort((a, b) => a.unit.localeCompare(b.unit, "ka", { numeric: true }));
  
  if ((selectedSide || selectedRoomCount) && !units.length) {
    unitsBox.innerHTML = `<div class="unit"><div class="owner empty">ამ არჩევანისთვის ბინები ვერ მოიძებნა</div></div>`;
    return;
  }
  for (const u of units) unitsBox.appendChild(unitCard(u));
}

function createFloorStairs(floorNum) {
  const stairsGroup = new THREE.Group();
  const steps = 10;
  const rise = 3.0 / steps;
  const run = 3.0 / steps;  
  const width = 2.0;
  const startZ = -0.8;

  for (let i = 0; i < steps; i++) {
    const stepGeo = new THREE.BoxGeometry(width, rise, run);
    const stepMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8 });
    const step = new THREE.Mesh(stepGeo, stepMat);
    
    step.position.set(0, (i + 0.5) * rise, startZ + (i + 0.5) * run);
    
    step.castShadow = true;
    step.receiveShadow = true;
    stairsGroup.add(step);
  }
  
  stairsGroup.position.y = 1.5 + (floorNum - 1) * 3;

  if (!floorStairGroups.has(floorNum)) floorStairGroups.set(floorNum, []);
  floorStairGroups.get(floorNum).push(stairsGroup);
  scene.add(stairsGroup);
}

function createShafts() {
  const shaftGroup = new THREE.Group();
  scalableShaftGroup = new THREE.Group();
  
  const centerX = 0; 
  const centerZ = -0.5; 
  const totalHeight = 40.5;

  const stairsGeo = new THREE.BoxGeometry(6.36, totalHeight, 2.31);
  const stairsMat = new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.15, depthWrite: false });
  const stairsBox = new THREE.Mesh(stairsGeo, stairsMat);
  stairsBox.position.set(centerX, totalHeight / 2, centerZ + 1.15); 
  scalableShaftGroup.add(stairsBox);

  const edgeMat = new THREE.LineBasicMaterial({ color: 0xff5555 });
  const edges = new THREE.EdgesGeometry(stairsGeo);
  const line = new THREE.LineSegments(edges, edgeMat);
  line.position.copy(stairsBox.position);
  scalableShaftGroup.add(line);

  const lobbyGeo = new THREE.BoxGeometry(6.36, totalHeight, 2.31);
  const lobbyMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.1, depthWrite: false });
  const lobby = new THREE.Mesh(lobbyGeo, lobbyMat);
  lobby.position.set(centerX, totalHeight / 2, centerZ - 1.15); 
  scalableShaftGroup.add(lobby);

  const lobbyEdges = new THREE.EdgesGeometry(lobbyGeo);
  const lobbyLine = new THREE.LineSegments(lobbyEdges, new THREE.LineBasicMaterial({ color: 0x55ffff }));
  lobbyLine.position.copy(lobby.position);
  scalableShaftGroup.add(lobbyLine);

  const shaftGeo = new THREE.BoxGeometry(5.30, totalHeight, 1.54);
  const shaftMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.2, depthWrite: false });
  const shaft = new THREE.Mesh(shaftGeo, shaftMat);
  shaft.position.set(centerX - 0.3, totalHeight / 2, centerZ - 1.5); 
  scalableShaftGroup.add(shaft);

  const shaftEdges = new THREE.EdgesGeometry(shaftGeo);
  const shaftLine = new THREE.LineSegments(shaftEdges, new THREE.LineBasicMaterial({ color: 0x55ff55 }));
  shaftLine.position.copy(shaft.position);
  scalableShaftGroup.add(shaftLine);

  shaftGroup.add(scalableShaftGroup);

  const carGeo = new THREE.CylinderGeometry(0.6, 0.6, 2.5, 16);
  const carMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
  
  const car1 = new THREE.Mesh(carGeo, carMat); 
  const car2 = new THREE.Mesh(carGeo, carMat); 
  
  scene.add(car1);
  scene.add(car2);
  elevatorCars = [car1, car2];

  const bridgeLeftGeo = new THREE.BoxGeometry(2, 0.2, 1.5); 
  const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x777777 });
  
  const bridgeLeft = new THREE.Mesh(bridgeLeftGeo, bridgeMat);
  bridgeLeft.position.set(centerX - 2.8, 10, centerZ - 1.5); 
  scalableShaftGroup.add(bridgeLeft);

  const bridgeTopGeo = new THREE.BoxGeometry(1.5, 0.2, 1.5); 
  const bridgeTop = new THREE.Mesh(bridgeTopGeo, bridgeMat);
  bridgeTop.position.set(centerX - 0.3, 10, centerZ - 2.5); 
  scalableShaftGroup.add(bridgeTop);

  scene.add(shaftGroup);
}

const loader = new GLTFLoader();
loader.load(
  "../output/building.glb",
  (gltf) => {
    const root = gltf.scene;
    root.traverse((o) => {
      if (!o.isMesh) return;
      o.castShadow = true;
      o.receiveShadow = true;
      o.material.side = THREE.DoubleSide;
      
      if (o.material.name === "Concrete") {
        o.material = o.material.clone();
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f4ece0'; 
        ctx.fillRect(0, 0, 512, 512);
        for(let i=0; i<4000; i++) {
          const x = Math.random() * 512;
          const y = Math.random() * 512;
          const w = Math.random() * 30;
          const h = Math.random() * 50;
          ctx.fillStyle = Math.random() > 0.5 ? 'rgba(120, 110, 90, 0.1)' : 'rgba(160, 150, 130, 0.15)';
          ctx.fillRect(x, y, w, h);
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(2, 2);
        o.material.map = texture;
        o.material.color.set(0xffffff); 
        o.material.roughness = 1;
      }
      if (o.material.name === "SlabBand") {
        o.material = o.material.clone();
        o.material.color.set(0xbab19d);
        o.material.roughness = 0.92;
      }
      if (o.name === "Ground") {
        o.material = o.material.clone();
        o.material.map = null;
        o.material.color.set(0x6d7958);
        o.material.roughness = 1;
      }
      
      const m = /^Floor_(\d{2})/.exec(o.name);
      if (m) {
        const n = Number(m[1]);
        o.userData.floor = n;
        if (!floorMeshes.has(n)) floorMeshes.set(n, []);
        floorMeshes.get(n).push(o);
      } else {
        const nameLower = o.name.toLowerCase();
        if (nameLower.includes("stair") || nameLower.includes("entrance")) {
          o.material = o.material.clone();
          entranceMeshes.push(o);
        } else if (nameLower.includes("roof") || nameLower.includes("membrane") || nameLower.includes("parapet") || nameLower.includes("wall") || nameLower.includes("concrete")) {
          o.material = o.material.clone(); 
          roofMeshes.push(o);
        }
      }
    });
    scene.add(root);

    for (let i = 0; i < 13; i++) {
      const aptA = create2RoomApartment();
      aptA.position.set(APT_POSITION_A[0], 1.5 + i * 3.0, APT_POSITION_A[2]);

      aptA.visible = false;

      apartmentsSideA.push(aptA);

      aptB.scale.set(...APT_SCALE);
      aptB.rotation.y = Math.PI;
      aptB.visible = false;
      scene.add(aptB);
      apartmentsSideB.push(aptB);
    }

    for (let i = 1; i <= 12; i++) {
        createFloorStairs(i);
    }

    createShafts();

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(5000, 5000),
      new THREE.MeshStandardMaterial({ color: 0x5a6e4b, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.1;
    ground.receiveShadow = true;
    scene.add(ground);

    const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.95 });
    const buildingApron = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), asphaltMat);
    buildingApron.rotation.x = -Math.PI / 2;
    buildingApron.position.set(0, 0.01, 0); 
    buildingApron.receiveShadow = true;
    scene.add(buildingApron);

    const parkingLot = new THREE.Mesh(new THREE.PlaneGeometry(60, 25), asphaltMat);
    parkingLot.rotation.x = -Math.PI / 2;
    parkingLot.position.set(0, 0.02, 30); 
    parkingLot.receiveShadow = true;
    scene.add(parkingLot);

    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.6, transparent: true });
    for (let x = -25; x <= 25; x += 3.5) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 6), lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(x, 0.03, 30); 
      scene.add(line);
    }

    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3320 });
    const leafMat1 = new THREE.MeshStandardMaterial({ color: 0x2d4c1e }); 
    const leafMat2 = new THREE.MeshStandardMaterial({ color: 0x426b2d }); 
    const pineMat = new THREE.MeshStandardMaterial({ color: 0x1a3312 });

        trunk.position.y = 1; trunk.castShadow = true; tree.add(trunk);
        const cone1 = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 8), pineMat);
        cone1.position.y = 2.5; cone1.castShadow = true; tree.add(cone1);
        const cone2 = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.5, 8), pineMat);
        cone2.position.y = 4; cone2.castShadow = true; tree.add(cone2);
      } else {
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 3), trunkMat);
        trunk.position.y = 1.5; trunk.castShadow = true; tree.add(trunk);
        const leaves1 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.8, 1), leafMat1);
        leaves1.position.y = 3.5; leaves1.castShadow = true; tree.add(leaves1);
        const leaves2 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 1), leafMat2);
        leaves2.position.set(0.8, 4.5, 0.5); leaves2.castShadow = true; tree.add(leaves2);
        const leaves3 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 1), leafMat1);
        leaves3.position.set(-0.7, 4.2, -0.6); leaves3.castShadow = true; tree.add(leaves3);

      scene.add(tree);
    }

    for (let x = -30; x <= 30; x += 5) {
      createTree(x + Math.random()*2, -22 - Math.random()*5, 'deciduous');
      if (x % 10 === 0) createTree(x, -28, 'pine');
    }
    for (let z = -15; z <= 15; z += 4) {
      createTree(24 + Math.random()*3, z, 'deciduous');
    }
    for (let z = -15; z <= 15; z += 5) {
      createTree(-24 - Math.random()*3, z, Math.random() > 0.5 ? 'deciduous' : 'pine');
    }

    const carColors = [0xffffff, 0x333333, 0x8b0000, 0x1a3b5c, 0x555555, 0x8a8a8a];
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.8 });
    const tireMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });

    function createCar(x, z, rotationY = 0) {
      const car = new THREE.Group();
      const randomColor = carColors[Math.floor(Math.random() * carColors.length)];
      const bodyMat = new THREE.MeshStandardMaterial({ color: randomColor, roughness: 0.4, metalness: 0.3 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 4), bodyMat);
      body.position.y = 0.6; body.castShadow = true; car.add(body);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.6, 2.2), glassMat);
      cabin.position.set(0, 1.3, -0.2); cabin.castShadow = true; car.add(cabin);
      const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 16);
      for (let i = 0; i < 4; i++) {
        const wheel = new THREE.Mesh(wheelGeo, tireMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(i < 2 ? 0.9 : -0.9, 0.35, i % 2 === 0 ? 1.3 : -1.3);
        wheel.castShadow = true; car.add(wheel);
      }
      car.position.set(x, 0, z);
      car.rotation.y = rotationY;
      scene.add(car);
    }

    for (let x = -22; x <= 22; x += 3.5) {
      if (Math.random() > 0.3) createCar(x, 27.5, Math.PI); 
      if (Math.random() > 0.5) createCar(x, 32.5, 0);

    const box = new THREE.Box3().setFromObject(root);
    const c = box.getCenter(new THREE.Vector3());
    controls.target.copy(c);
    camera.position.set(c.x + 43, c.y + 22, c.z + 76);
    controls.update();

    targetCamPos.copy(camera.position);
    targetLookAt.copy(controls.target);

    const ab = document.createElement("button");
    ab.className = "aux-btn";
    ab.textContent = "არასაცხ.";
    ab.onclick = () => toggleAux();
    floorBar.appendChild(ab);
    for (let n = 1; n <= 13; n++) {
      const b = document.createElement("button");
      b.textContent = n;
      b.dataset.floor = n;
      b.onclick = () => selectFloor(n);
      floorBar.appendChild(b);
    }
    refreshSelection();
    
    setTimeout(resize, 50);
    setTimeout(resize, 250);
    
    loadingOverlay.classList.add("hidden");
  },

    errBox.textContent = "building.glb ვერ ჩაიტვირთა.";
    loadingOverlay.classList.add("hidden");
  }
);

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let down = null;

renderer.domElement.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) return;
  down = null;

  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);

  if (isAptViewActive) return;

  const all = [];
  for (const meshes of floorMeshes.values()) all.push(...meshes);
  const hits = ray.intersectObjects(all, false);
  if (hits.length) {
    const zone = classifyPoint(hits[0].point);
    if (zone) {
      const floor = hits[0].object.userData.floor;
      if (floor) selectBuildingSide(floor, zone.side, zone.roomCount);
    }
  }
});

roomFilters.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-rooms]");
  if (button) selectRoomCount(Number(button.dataset.rooms));
});

viewAptBtn.addEventListener("click", () => {
  // თუ კორპუსი გაშლილია, ჯერ ავაწყოთ
  if (!isAptViewActive && isExploded) {
    explodeBtn.click();
  }

  isAptViewActive = !isAptViewActive;
  viewAptBtn.classList.toggle("on", isAptViewActive);

  if (isAptViewActive) {
    targetLookAt.set(0.76, 39.0, 0); 
    targetCamPos.set(0.76, 45, 30);
    
    for (const mesh of roofMeshes) mesh.visible = false;
    for (const [n, groups] of floorStairGroups) {
      for (const group of groups) group.visible = true;
    }
    if (scalableShaftGroup) scalableShaftGroup.visible = true;
    if (elevatorCars) elevatorCars.forEach(c => c.visible = true);

    for (const [n, meshes] of floorMeshes) {
      for (const mesh of meshes) {
        mesh.visible = true;
        if (mesh.isMesh && mesh.material) {
          if (n === 13) {
            mesh.material.transparent = true;
            mesh.material.opacity = 0.3;
          } else {
            mesh.material.transparent = false;
            mesh.material.opacity = 1.0;
          }
          mesh.material.needsUpdate = true;
        }
      }
    }

    apartmentsSideA.forEach((apt, i) => apt.visible = (i === 12));
    apartmentsSideB.forEach((apt, i) => apt.visible = (i === 12));

    controls.autoRotate = false; 
  } else {
    targetLookAt.set(0, isExploded ? 50 : 15, 0);
    targetCamPos.set(isExploded ? 110 : 43, isExploded ? 80 : 22, isExploded ? 130 : 76);

    for (const [n, meshes] of floorMeshes) {
      for (const mesh of meshes) {
        mesh.visible = true;
        if (mesh.isMesh && mesh.material) {
          mesh.material.transparent = isExploded;
          mesh.material.opacity = isExploded ? 0.3 : 1.0;
          mesh.material.needsUpdate = true;
        }
      }
    }

    for (const mesh of roofMeshes) mesh.visible = true;
    for (const [n, groups] of floorStairGroups) {
      for (const group of groups) group.visible = true;
    }
    if (scalableShaftGroup) scalableShaftGroup.visible = true;
    if (elevatorCars) elevatorCars.forEach(c => c.visible = true);

    apartmentsSideA.forEach(apt => apt.visible = isExploded);
    apartmentsSideB.forEach(apt => apt.visible = isExploded);

    controls.autoRotate = true;
  }
  isAnimating = true;
});

function resize() {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  if (w === 0 || h === 0) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
addEventListener("resize", resize);

const resizeObserver = new ResizeObserver(() => {
  resize();
});
resizeObserver.observe(wrap);

let isAnimating = false;
const targetCamPos = new THREE.Vector3();
const targetLookAt = new THREE.Vector3();
controls.addEventListener('start', () => { isAnimating = false; });

let prevT = performance.now() / 1000;

renderer.setAnimationLoop(() => {
  const now = performance.now() / 1000;
  const dt = Math.min(now - prevT, 0.1); 
  prevT = now;
  const k = 1 - Math.exp(-dt * 8); // კადრების სიხშირისგან დამოუკიდებელი ანიმაცია

  if (isAnimating) {
    camera.position.lerp(targetCamPos, k);
    controls.target.lerp(targetLookAt, k);
    if (camera.position.distanceTo(targetCamPos) < 0.1) {
      isAnimating = false;
      if (selected === null && !isAptViewActive) controls.autoRotate = true;
    }
  } else {
    controls.update();
  }

  for (const [n, meshes] of floorMeshes) {
    const targetY = isExploded ? (n - 1) * 8 : 0; 
    for (const mesh of meshes) {
      mesh.position.y += (targetY - mesh.position.y) * k;
    }
  }

  for (let i = 0; i < apartmentsSideA.length; i++) {
    const baseY = 1.5 + i * 3.0;
    const targetY = isExploded ? baseY + i * 8.0 : baseY;
    
    apartmentsSideA[i].position.y += (targetY - apartmentsSideA[i].position.y) * k;
    if (apartmentsSideB[i]) {
      apartmentsSideB[i].position.y += (targetY - apartmentsSideB[i].position.y) * k;
    }
  }

  for (const [n, groups] of floorStairGroups) {
    const baseY = 1.5 + (n - 1) * 3;
    const targetY = isExploded ? baseY + (n - 1) * 8 : baseY; 
    for (const group of groups) {
      group.position.y += (targetY - group.position.y) * k;
    }
  }

  const roofTargetY = isExploded ? 13 * 8 : 0;
  for (const mesh of roofMeshes) {
    mesh.position.y += (roofTargetY - mesh.position.y) * k;
  }

  shaftScale += (targetShaftScale - shaftScale) * k;
  if (scalableShaftGroup) {
    scalableShaftGroup.scale.y = shaftScale;
  }

  if (elevatorCars.length > 0) {
    const time = Date.now() * 0.001;
    const cycle = Math.sin(time * 0.8); 
    const t = (cycle + 1) / 2; 

    const yBase = 1.5; 
    const yTop = isExploded ? (11 * 8) + 1.5 : 34.5; 

    const carY = yBase + t * (yTop - yBase);
    
    elevatorCars[0].position.set(-1.0, carY, -2.3);
    elevatorCars[1].position.set(0.5, carY + 4, -2.3);
  }

  if (sideHighlight) {
    const time = Date.now() * 0.0015; 
    sideHighlightMaterial.opacity = 0.5 + (Math.sin(time) * 0.3); 
  }

  if (rainParticles || snowParticles) {
    const particles = rainParticles || snowParticles;
    const positions = particles.geometry.attributes.position.array;
    for (let i = 1; i < positions.length; i += 3) {
      positions[i] -= 0.8;
      if (positions[i] < 0) positions[i] = 80;
    }
    particles.geometry.attributes.position.needsUpdate = true;
  }

  renderer.render(scene, camera);
});

async function init() {
  await fetchWeather();
  updateTimeDisplay();
  updateSunAndSky(currentDate);
  await loadResidents();
  renderPanel();
}
init();
</script>
